apiVersion: apps/v1
kind: Deployment
metadata:
  name: sea-state-service
  labels:
    app: sea-state-service
    component: exodus-rush
spec:
  replicas: 3  # Multiple replicas to expose the bug!
  selector:
    matchLabels:
      app: sea-state-service
  template:
    metadata:
      labels:
        app: sea-state-service
        component: exodus-rush
    spec:
      containers:
      - name: sea-state-service
        image: ghcr.io/stealthymcstelath/exodus-rush-sea-state-service:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: sea-state-secrets
              key: admin-token
        # THE BUG: STATE_CACHE_URL is NOT set!
        # This causes the service to use InMemoryBackend instead of EtcdBackend,
        # resulting in per-pod state that is inconsistent across replicas.
        #
        # To fix, uncomment the following:
        # - name: STATE_CACHE_URL
        #   value: "etcd:2379"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Secret
metadata:
  name: sea-state-secrets
type: Opaque
stringData:
  admin-token: exodus-admin-2026
